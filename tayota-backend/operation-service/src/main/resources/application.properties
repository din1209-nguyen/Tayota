spring.application.name=operation-service
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder-prefix=${CLOUDINARY_FOLDER_PREFIX:tayota}
appointment.booking.business-zone=${APPOINTMENT_BUSINESS_ZONE:Asia/Bangkok}
appointment.booking.user-daily-limit=${APPOINTMENT_USER_DAILY_LIMIT:5}
appointment.booking.guest-daily-limit=${APPOINTMENT_GUEST_DAILY_LIMIT:3}
appointment.booking.user-cooldown=${APPOINTMENT_USER_COOLDOWN:60s}
appointment.booking.guest-cooldown=${APPOINTMENT_GUEST_COOLDOWN:120s}
appointment.booking.minimum-notice=${APPOINTMENT_MINIMUM_NOTICE:12h}
