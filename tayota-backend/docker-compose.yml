  # --- Redis ---
  redis:
    image: redis:7.2-alpine
    volumes:
      - ./docker-data/redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - tayota-network
    command: redis-server --appendonly yes # Bật chế độ lưu trữ dữ liệu lên đĩa (Mỗi khi có dữ liệu mới, ghi ngay một bản sao vào ổ cứng)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

   # --- User Service ---
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      - SERVER_PORT=${USER_SERVICE_PORT:-8091}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # Tự động đồng bộ database với Entity
      - SPRING_SQL_INIT_MODE=always # Luôn chạy schema.sql khi khởi động dự án
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=false # Chạy các file .sql trước Hibernate
      - SPRING_SQL_INIT_SEPARATOR=//
      # --- Postgres ---
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user-service:5432/${POSTGRES_USER_DB:-tayota_user_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # --- JWT ---
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
      # --- Redis ---
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      # --- gRPC Client---
      - GRPC_NOTIFICATION_SERVICE_HOST=${OPERATION_SERVICE_HOST:-operation-service}
      - GRPC_NOTIFICATION_SERVICE_PORT=${NOTIFICATION_SERVICE_GRPC_PORT:-8193}
      # --- Cookie ---
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      postgres-user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tayota-network

  # Spring Boot service that serves GET /cars/versions and uses Redis cache (gpt)
  car-service:
    build:
      # Build from backend root because car-service Dockerfile needs common-core too (gpt)
      context: .
      dockerfile: car-service/Dockerfile
    environment:
      # Run car-service on the same port used by the gateway route (gpt)
      - SERVER_PORT=${CAR_SERVICE_PORT:-8092}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # Auto-sync database tables from JPA entities (gpt)
      - SPRING_SQL_INIT_MODE=always # Run SQL initialization files when present (gpt)
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=false # Run SQL init before Hibernate when applicable (gpt)
      - SPRING_SQL_INIT_SEPARATOR=//
      # PostgreSQL connection for car catalog data (gpt)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-car-service:5432/${POSTGRES_CAR_DB:-tayota_car_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # Redis connection for 10-minute cars/versions cache (gpt)
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      # Kafka producer for async view history and behavior log events
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      # Wait for car database healthcheck before booting JPA (gpt)
      postgres-car-service:
        condition: service_healthy
      # Wait for Redis because the endpoint uses RedisTemplate cache (gpt)
      redis:
        condition: service_healthy
    networks:
      - tayota-network

  # --- Operation Service ---
  operation-service:
    build:
      context: .
      dockerfile: operation-service/Dockerfile
    environment:
      - SERVER_PORT=${OPERATION_SERVICE_PORT:-8093}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # Tự động đồng bộ database với Entity
      - SPRING_SQL_INIT_MODE=always # Luôn chạy schema.sql khi khởi động dự án
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=false # Chạy các file .sql trước Hibernate
      - SPRING_SQL_INIT_SEPARATOR=//
      # --- Postgres ---
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-operation-service:5432/${POSTGRES_OPERATION_DB:-tayota_operation_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # --- Redis ---
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      # --- gRPC Server---
      - SPRING_GRPC_SERVER_PORT=${NOTIFICATION_SERVICE_GRPC_PORT:-8193}
      # --- Email (SMTP) ---
      # Địa chỉ máy chủ SMTP (Ví dụ: smtp.gmail.com cho Gmail)
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      # Cổng gửi mail (587 là cổng tiêu chuẩn cho TLS/STARTTLS)
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      # Email dùng để gửi đi (Thay bằng email của bạn hoặc dùng biến .env)
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      # QUAN TRỌNG: Mật khẩu ứng dụng (App Password), không phải mật khẩu đăng nhập email
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      # Yêu cầu xác thực khi gửi mail (Luôn là true với Gmail)
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      # Bật bảo mật TLS (Bắt buộc để tránh bị lộ thông tin trên đường truyền)
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      # Tin cậy máy chủ SMTP (Dấu * nghĩa là tin cậy mọi host để tránh lỗi SSL trong Docker)
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=true
    depends_on:
      postgres-operation-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tayota-network

