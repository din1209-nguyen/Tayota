server:
  port: ${API_GATEWAY_PORT:9090}
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: INFO
    reactor.netty: INFO
ai:
  chat:
    cookie:
      secure: ${AI_CHAT_COOKIE_SECURE:false}
    session-ttl-seconds: ${AI_CHAT_SESSION_TTL_SECONDS:21600}
jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:change-me-gateway-internal-secret}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: operation-user-ws-route
              uri: ws://${OPERATION_SERVICE_HOST:operation-service}:${OPERATION_SERVICE_PORT:8091}
              predicates:
                - Path=/user/chat/ws/**
              filters:
                - StripPrefix=1
            - id: operation-user-route
              uri: http://${OPERATION_SERVICE_HOST:operation-service}:${OPERATION_SERVICE_PORT:8091}
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1

            - id: car-route
              uri: http://${OPERATION_SERVICE_HOST:operation-service}:${OPERATION_SERVICE_PORT:8091}
              predicates:
                - Path=/car/**
              filters:
                - StripPrefix=1

            - id: operation-service-route
              uri: http://${OPERATION_SERVICE_HOST:operation-service}:${OPERATION_SERVICE_PORT:8091}
              predicates:
                - Path=/operation/**
              filters:
                - StripPrefix=1

            - id: ai-service-route
              uri: http://${AI_SERVICE_HOST:ai-service}:${AI_SERVICE_PORT:8094}
              predicates:
                - Path=/ai/**
              filters:
                - StripPrefix=1
