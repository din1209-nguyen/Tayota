services:
  api-gateway:
    build: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8090}:${API_GATEWAY_PORT:-8090}"
    environment:
      - API_GATEWAY_PORT=${API_GATEWAY_PORT:-8090}
      - USER_SERVICE_HOST=${USER_SERVICE_HOST:-user-service}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT:-8091}
      - CAR_SERVICE_HOST=${CAR_SERVICE_HOST:-car-service}
      - CAR_SERVICE_PORT=${CAR_SERVICE_PORT:-8092}
      - OPERATION_SERVICE_HOST=${OPERATION_SERVICE_HOST:-operation-service}
      - OPERATION_SERVICE_PORT=${OPERATION_SERVICE_PORT:-8093}
      - AI_SERVICE_HOST=${AI_SERVICE_HOST:-ai-service}
      - AI_SERVICE_PORT=${AI_SERVICE_PORT:-8094}
      - CHAT_SERVICE_HOST=${CHAT_SERVICE_HOST:-chat-service}
      - CHAT_SERVICE_PORT=${CHAT_SERVICE_PORT:-8095}
      - ANALYSIS_SERVICE_HOST=${ANALYSIS_SERVICE_HOST:-analysis-service}
      - ANALYSIS_SERVICE_PORT=${ANALYSIS_SERVICE_PORT:-8096}
      - NOTIFICATION_SERVICE_HOST=${NOTIFICATION_SERVICE_HOST:-notification-service}
      - NOTIFICATION_SERVICE_PORT=${NOTIFICATION_SERVICE_PORT:-8097}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      user-service:
        condition: service_started
      car-service:
        condition: service_started
      ai-service:
        condition: service_started
    networks:
      - tayota-network

  # --- Postgres User Service ---
  postgres-user-service:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER_DB:-tayota_user_db}
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres-user-service:/var/lib/postgresql/data
    networks:
      - tayota-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_USER_DB:-tayota_user_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Postgres Car Service ---
  postgres-car-service:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CAR_DB:-tayota_car_db}
    ports:
      - "5434:5432"
    volumes:
      - ./docker-data/postgres-car-service:/var/lib/postgresql/data
    networks:
      - tayota-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_CAR_DB:-tayota_car_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Postgres Operation Service ---
  postgres-operation-service:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OPERATION_DB:-tayota_operation_db}
    ports:
      - "5433:5432"
    volumes:
      - ./docker-data/postgres-operation-service:/var/lib/postgresql/data
    networks:
      - tayota-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_OPERATION_DB:-tayota_operation_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MongoDB ---
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-tayota}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-123456}
    ports:
      - "27017:27017"
    volumes:
      - ./docker-data/mongo-data:/data/db
    networks:
      - tayota-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7.2-alpine
    volumes:
      - ./docker-data/redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - tayota-network
    command: redis-server --appendonly yes # Bật chế độ lưu trữ dữ liệu lên đĩa (Mỗi khi có dữ liệu mới, ghi ngay một bản sao vào ổ cứng)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Qdrant Vector Database ---
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./docker-data/qdrant-storage:/qdrant/storage
    networks:
      - tayota-network

   # --- User Service ---
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      - SERVER_PORT=${USER_SERVICE_PORT:-8091}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # Tự động đồng bộ database với Entity
      - SPRING_SQL_INIT_MODE=always # Không chạy schema.sql khi khởi động dự án
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=true # Chạy các file .sql sau Hibernate
      # --- Postgres ---
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user-service:5432/${POSTGRES_USER_DB:-tayota_user_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # --- JWT ---
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS:-${GOOGLE_CLIENT_ID}}
      - GOOGLE_CSRF_REQUIRED=${GOOGLE_CSRF_REQUIRED:-false}
      # --- Redis ---
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      # --- Cookie ---
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # --- Email (SMTP) ---
      # Địa chỉ máy chủ SMTP (Ví dụ: smtp.gmail.com cho Gmail)
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      # Cổng gửi mail (587 là cổng tiêu chuẩn cho TLS/STARTTLS)
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      # Email dùng để gửi đi (Thay bằng email của bạn hoặc dùng biến .env)
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      # QUAN TRỌNG: Mật khẩu ứng dụng (App Password), không phải mật khẩu đăng nhập email
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      # Yêu cầu xác thực khi gửi mail (Luôn là true với Gmail)
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      # Bật bảo mật TLS (Bắt buộc để tránh bị lộ thông tin trên đường truyền)
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      # Tin cậy máy chủ SMTP (Dấu * nghĩa là tin cậy mọi host để tránh lỗi SSL trong Docker)
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=true
    depends_on:
      postgres-user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tayota-network

  # --- Car Service ---
  car-service:
    build:
      context: .
      dockerfile: car-service/Dockerfile
    environment:
      - SERVER_PORT=${CAR_SERVICE_PORT:-8092}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # Tự động đồng bộ database với Entity
      - SPRING_SQL_INIT_MODE=always # Luôn chạy schema.sql khi khởi động dự án
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=false # Chạy các file .sql trước Hibernate
      - SPRING_SQL_INIT_SEPARATOR=//
      # --- Postgres ---
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-car-service:5432/${POSTGRES_CAR_DB:-tayota_car_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # --- Redis ---
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      postgres-car-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tayota-network

  # --- AI Service ---
  ai-service:
    build: ai-service
    ports:
      - "${AI_SERVICE_PORT:-8094}:${AI_SERVICE_PORT:-8094}"
    environment:
      - AI_SERVICE_PORT=${AI_SERVICE_PORT:-8094}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - MONGO_URI=mongodb://${MONGO_USER:-tayota}:${MONGO_PASSWORD:-123456}@mongodb:27017/${MONGO_AI_DB:-tayota_ai_db}?authSource=admin
      - MONGO_DB=${MONGO_AI_DB:-tayota_ai_db}
      - MONGO_GRIDFS_BUCKET=ai_pdfs
      - COLLECTION=${COLLECTION:-atbm_httt}
      - SESSION_TTL_SECS=${SESSION_TTL_SECS:-3600}
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - tayota-network

